<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Bank26 Core Banking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
            padding: 2.5rem;
        }
        .brand-logo {
            width: 56px;
            height: 56px;
            background: #1e3a8a;
            color: #ffffff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1.25rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand-logo">
            <i class="bi bi-bank2"></i>
        </div>
        <h3 class="fw-bold mb-1">E-Bank26</h3>
        <p class="text-muted small">Core Banking Management System</p>
    </div>

    <!-- Alert Messages -->
    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert" th:text="${errorMessage}"></div>
    <div th:if="${logoutMessage}" class="alert alert-success py-2 small" role="alert" th:text="${logoutMessage}"></div>

    <form th:action="@{/login}" method="post" class="needs-validation">
        <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
            <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
    </form>

    <div class="mt-4 pt-3 border-top text-center">
        <div class="small text-muted mb-1">Default Credentials:</div>
        <div class="badge bg-light text-dark border p-2">
            <code>admin</code> / <code>admin123</code> &bull; <code>staff</code> / <code>staff123</code>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
