<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Member - E-Bank26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('members')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Member Registration')}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">Personal & KYC Details</h5>
                    <small class="text-muted">Member code will be generated automatically upon submission</small>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/members/add}" th:object="${memberRequest}" method="post" class="needs-validation">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Full Name *</label>
                                <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. Ramesh Kumar" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Date of Birth</label>
                                <input type="date" th:field="*{dob}" class="form-control">
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Gender</label>
                                <select th:field="*{gender}" class="form-select">
                                    <option value="">Select Gender</option>
                                    <option value="MALE">Male</option>
                                    <option value="FEMALE">Female</option>
                                    <option value="OTHER">Other</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Mobile Number *</label>
                                <input type="tel" th:field="*{mobile}" class="form-control" placeholder="10-digit mobile" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com">
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Address</label>
                                <textarea th:field="*{address}" class="form-control" rows="2" placeholder="Residential address"></textarea>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">KYC / National ID Number</label>
                                <input type="text" th:field="*{kycNumber}" class="form-control" placeholder="Aadhaar / PAN / Voter ID">
                            </div>

                            <div class="col-md-12 mt-4">
                                <div class="p-3 bg-light rounded border">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" th:field="*{createSavingsAccount}" id="createSavings">
                                        <label class="form-check-label fw-semibold text-primary" for="createSavings">
                                            <i class="bi bi-wallet2 me-1"></i> Auto-create initial Savings Account (SB) for this member
                                        </label>
                                    </div>
                                    <small class="text-muted d-block ms-4">If checked, an active Savings Account will be provisioned immediately.</small>
                                </div>
                            </div>

                            <div class="col-md-12 mt-4 d-flex justify-content-end gap-2">
                                <a th:href="@{/members}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">Register Member</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/static/js/validation.js}"></script>
</body>
</html>
