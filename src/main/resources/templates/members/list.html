<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - E-Bank26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('members')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Member Management')}"></div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Actions & Filter Bar -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-2 justify-content-between align-items-center">
                <div class="col-md-8">
                    <form th:action="@{/members}" method="get" class="row g-2">
                        <div class="col-md-6">
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                                <input type="text" name="query" th:value="${query}" class="form-control" placeholder="Search by name, code, or mobile...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select name="status" class="form-select">
                                <option value="" th:selected="${status == null or status == ''}">All Statuses</option>
                                <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Active</option>
                                <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Inactive</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-outline-primary w-100">Filter</button>
                        </div>
                    </form>
                </div>
                <div class="col-md-3 text-end">
                    <a th:href="@{/members/add}" class="btn btn-primary">
                        <i class="bi bi-person-plus-fill me-1"></i> Add New Member
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Members Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Code</th>
                        <th>Full Name</th>
                        <th>Mobile</th>
                        <th>KYC Number</th>
                        <th>Status</th>
                        <th>Joined</th>
                        <th>Accounts</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="member : ${members}">
                        <td class="ps-4 fw-semibold text-primary" th:text="${member.memberCode}">MEM-0001</td>
                        <td class="fw-medium" th:text="${member.fullName}">John Doe</td>
                        <td th:text="${member.mobile}">9876543210</td>
                        <td><code th:text="${member.kycNumber != null ? member.kycNumber : '-'}"></code></td>
                        <td>
                            <span class="badge" th:classappend="${member.status == 'ACTIVE' ? 'badge-active' : 'badge-closed'}" th:text="${member.status}">ACTIVE</span>
                        </td>
                        <td th:text="${#temporals.format(member.createdAt, 'dd-MMM-yyyy')}">01-Jan-2026</td>
                        <td>
                            <span class="badge bg-light text-dark border me-1" th:text="|SB: ${member.savingsAccountsCount}|"></span>
                            <span class="badge bg-light text-dark border" th:text="|Loans: ${member.loansCount}|"></span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/members/edit/{id}(id=${member.memberId})}" class="btn btn-sm btn-outline-secondary me-1" title="Edit Profile">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/members/delete/{id}(id=${member.memberId})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to deactivate this member?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Deactivate">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(members)}">
                        <td colspan="8" class="text-center py-4 text-muted">No members found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${totalPages > 1}">
            <div class="small text-muted">Total: <span th:text="${totalItems}">0</span> members</div>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/members(page=${currentPage - 1}, query=${query}, status=${status})}">Prev</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i ? 'active' : ''}">
                    <a class="page-link" th:href="@{/members(page=${i}, query=${query}, status=${status})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage >= totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/members(page=${currentPage + 1}, query=${query}, status=${status})}">Next</a>
                </li>
            </ul>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/static/js/main.js}"></script>
</body>
</html>
