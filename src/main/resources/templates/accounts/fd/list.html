<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Deposits - E-Bank26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('fd')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Fixed Deposits (FD)')}"></div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Filters & Action Bar -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-2 justify-content-between align-items-center">
                <div class="col-md-8">
                    <form th:action="@{/accounts/fd}" method="get" class="row g-2">
                        <div class="col-md-6">
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                                <input type="text" name="query" th:value="${query}" class="form-control" placeholder="Search FD number, member name...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select name="status" class="form-select">
                                <option value="" th:selected="${status == null or status == ''}">All Statuses</option>
                                <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Active</option>
                                <option value="MATURED" th:selected="${status == 'MATURED'}">Matured</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-outline-primary w-100">Search</button>
                        </div>
                    </form>
                </div>
                <div class="col-md-3 text-end">
                    <a th:href="@{/accounts/fd/create}" class="btn btn-primary">
                        <i class="bi bi-plus-circle me-1"></i> Open Fixed Deposit
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- FD Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">FD Number</th>
                        <th>Member Name</th>
                        <th>Principal (INR)</th>
                        <th>Interest Rate</th>
                        <th>Tenure</th>
                        <th>Maturity Amount</th>
                        <th>Maturity Date</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="fd : ${deposits}">
                        <td class="ps-4 fw-bold text-primary" th:text="${fd.fdNumber}">FD20000001</td>
                        <td class="fw-medium" th:text="${fd.member.fullName}">John Doe</td>
                        <td class="fw-bold" th:text="|₹ ${#numbers.formatDecimal(fd.principal, 1, 2)}|">₹ 10,000.00</td>
                        <td th:text="|${fd.interestRate}% p.a.|">7.50%</td>
                        <td th:text="|${fd.tenureMonths} Months|">12 Months</td>
                        <td class="fw-bold text-success" th:text="|₹ ${#numbers.formatDecimal(fd.maturityAmount, 1, 2)}|">₹ 10,750.00</td>
                        <td th:text="${#temporals.format(fd.maturityDate, 'dd-MMM-yyyy')}">01-Jan-2027</td>
                        <td>
                            <span class="badge" th:classappend="${fd.status == 'ACTIVE' ? 'badge-active' : 'badge-closed'}" th:text="${fd.status}">ACTIVE</span>
                        </td>
                        <td class="text-end pe-4">
                            <form th:if="${fd.status == 'ACTIVE'}" th:action="@{/accounts/fd/close/{id}(id=${fd.fdId})}" method="post" class="d-inline" onsubmit="return confirm('Mature / Close this Fixed Deposit and process payout?');">
                                <button type="submit" class="btn btn-sm btn-outline-success">
                                    <i class="bi bi-check-circle"></i> Mature Payout
                                </button>
                            </form>
                            <span th:if="${fd.status != 'ACTIVE'}" class="text-muted small">Closed</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(deposits)}">
                        <td colspan="9" class="text-center py-4 text-muted">No fixed deposits found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${totalPages > 1}">
            <div class="small text-muted">Total: <span th:text="${totalItems}">0</span> deposits</div>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/accounts/fd(page=${currentPage - 1}, query=${query}, status=${status})}">Prev</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i ? 'active' : ''}">
                    <a class="page-link" th:href="@{/accounts/fd(page=${i}, query=${query}, status=${status})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage >= totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/accounts/fd(page=${currentPage + 1}, query=${query}, status=${status})}">Next</a>
                </li>
            </ul>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
