<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Fixed Deposit - E-Bank26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('fd')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('New Fixed Deposit')}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">Fixed Deposit Parameters</h5>
                    <small class="text-muted">Maturity amount & date are calculated automatically</small>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/accounts/fd/create}" th:object="${fixedDepositRequest}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Member *</label>
                            <select th:field="*{memberId}" class="form-select" required>
                                <option value="">-- Choose Member --</option>
                                <option th:each="m : ${members}" th:value="${m.memberId}" th:text="|${m.fullName} (${m.memberCode}) - ${m.mobile}|"></option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Principal Amount (INR) *</label>
                            <input type="number" step="100" min="1000" th:field="*{principal}" class="form-control" placeholder="Minimum ₹ 1,000" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('principal')}" th:errors="*{principal}"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Interest Rate (% p.a.) *</label>
                                <input type="number" step="0.01" th:field="*{interestRate}" class="form-control" placeholder="e.g. 7.50" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('interestRate')}" th:errors="*{interestRate}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Tenure (Months) *</label>
                                <input type="number" min="1" max="120" th:field="*{tenureMonths}" class="form-control" placeholder="e.g. 12" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tenureMonths')}" th:errors="*{tenureMonths}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Interest Compounding Type</label>
                            <select th:field="*{interestType}" class="form-select">
                                <option value="SIMPLE">Simple Interest</option>
                                <option value="COMPOUND">Compound Interest (Quarterly)</option>
                            </select>
                        </div>

                        <div class="mt-4 d-flex justify-content-end gap-2">
                            <a th:href="@{/accounts/fd}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Open Fixed Deposit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
