<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Statement - E-Bank26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('savings')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Account Statement')}"></div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Account Details Card -->
    <div class="card mb-4 border-primary">
        <div class="card-body p-4">
            <div class="row align-items-center">
                <div class="col-md-3">
                    <span class="text-muted small">Account Number</span>
                    <h4 class="fw-bold text-primary mb-0" th:text="${account.accountNumber}">SB10000001</h4>
                </div>
                <div class="col-md-3">
                    <span class="text-muted small">Account Holder</span>
                    <h5 class="fw-semibold mb-0" th:text="${account.member.fullName}">John Doe</h5>
                    <small class="text-muted" th:text="|Code: ${account.member.memberCode}|"></small>
                </div>
                <div class="col-md-3">
                    <span class="text-muted small">Available Balance</span>
                    <h3 class="fw-bold text-success mb-0" th:text="|₹ ${#numbers.formatDecimal(account.balance, 1, 2)}|">₹ 0.00</h3>
                </div>
                <div class="col-md-3 text-end">
                    <button type="button" class="btn btn-success me-1"
                            data-bs-toggle="modal" data-bs-target="#transactionModal"
                            th:data-account-id="${account.sbId}"
                            th:data-account-number="${account.accountNumber}"
                            data-txn-type="Deposit">
                        <i class="bi bi-arrow-down-left"></i> Deposit
                    </button>
                    <button type="button" class="btn btn-outline-danger"
                            data-bs-toggle="modal" data-bs-target="#transactionModal"
                            th:data-account-id="${account.sbId}"
                            th:data-account-number="${account.accountNumber}"
                            data-txn-type="Withdraw">
                        <i class="bi bi-arrow-up-right"></i> Withdraw
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Date Range Filter -->
    <div class="card mb-4">
        <div class="card-body py-3">
            <form th:action="@{/accounts/savings/statement/{id}(id=${account.sbId})}" method="get" class="row g-2 align-items-center">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-muted mb-0">From Date</label>
                    <input type="date" name="from" th:value="${from}" class="form-control form-control-sm">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-muted mb-0">To Date</label>
                    <input type="date" name="to" th:value="${to}" class="form-control form-control-sm">
                </div>
                <div class="col-md-4 d-flex align-items-end pt-3">
                    <button type="submit" class="btn btn-sm btn-outline-primary me-2"><i class="bi bi-funnel"></i> Filter</button>
                    <a th:href="@{/accounts/savings/statement/{id}(id=${account.sbId})}" class="btn btn-sm btn-outline-secondary">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Transactions Passbook Table -->
    <div class="card">
        <div class="card-header bg-white py-3">
            <h6 class="mb-0 fw-bold"><i class="bi bi-list-columns-reverse me-2"></i> Passbook Transactions</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Date & Time</th>
                        <th>Type</th>
                        <th>Narration</th>
                        <th>Reference</th>
                        <th class="text-end">Debit (Withdrawal)</th>
                        <th class="text-end">Credit (Deposit)</th>
                        <th class="text-end pe-4">Balance After</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="txn : ${transactions}">
                        <td class="ps-4" th:text="${#temporals.format(txn.txnDate, 'dd-MMM-yyyy HH:mm')}">01-Jan-2026 12:00</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${txn.txnType == 'DEPOSIT' or txn.txnType == 'INTEREST' ? 'badge-active' : 'badge-closed'}"
                                  th:text="${txn.txnType}">DEPOSIT</span>
                        </td>
                        <td th:text="${txn.narration}">Cash Deposit</td>
                        <td><small class="text-muted" th:text="${txn.referenceNumber != null ? txn.referenceNumber : '-'}"></small></td>
                        <td class="text-end text-danger fw-semibold"
                            th:text="${txn.txnType == 'WITHDRAW' ? '₹ ' + #numbers.formatDecimal(txn.amount, 1, 2) : '-'}">-</td>
                        <td class="text-end text-success fw-semibold"
                            th:text="${txn.txnType == 'DEPOSIT' or txn.txnType == 'INTEREST' ? '₹ ' + #numbers.formatDecimal(txn.amount, 1, 2) : '-'}">-</td>
                        <td class="text-end pe-4 fw-bold" th:text="|₹ ${#numbers.formatDecimal(txn.balanceAfter, 1, 2)}|">₹ 0.00</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(transactions)}">
                        <td colspan="7" class="text-center py-4 text-muted">No transactions found for this period.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal for quick deposit/withdraw -->
<div class="modal fade" id="transactionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalTitle">Post Transaction</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="modalForm" th:action="@{/accounts/savings/deposit}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="modal-body">
                    <input type="hidden" id="modalAccountId" name="accountId" th:value="${account.sbId}">
                    <input type="hidden" id="modalTxnType" name="txnType" value="DEPOSIT">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Amount (INR) *</label>
                        <input type="number" step="0.01" min="0.01" name="amount" class="form-control" placeholder="Enter amount" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Narration</label>
                        <input type="text" name="narration" class="form-control" placeholder="e.g. Counter Cash Transaction">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Reference / Cheque Number</label>
                        <input type="text" name="referenceNumber" class="form-control" placeholder="Optional reference">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary px-4">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/static/js/main.js}"></script>
</body>
</html>
