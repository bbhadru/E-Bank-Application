<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Savings Account - E-Bank26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('savings')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Open Savings Account')}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">Account Parameters</h5>
                    <small class="text-muted">Account number will be auto-generated</small>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/accounts/savings/create}" th:object="${savingsAccountRequest}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Member *</label>
                            <select th:field="*{memberId}" class="form-select" required>
                                <option value="">-- Choose Member --</option>
                                <option th:each="m : ${members}" th:value="${m.memberId}" th:text="|${m.fullName} (${m.memberCode}) - ${m.mobile}|"></option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Annual Interest Rate (%) *</label>
                            <input type="number" step="0.01" th:field="*{interestRate}" class="form-control" value="4.00" required>
                            <small class="text-muted">Default is 4.00% calculated on daily product</small>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('interestRate')}" th:errors="*{interestRate}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Minimum Balance Requirement (INR)</label>
                            <input type="number" step="0.01" th:field="*{minimumBalance}" class="form-control" value="500.00">
                            <small class="text-muted">Default minimum balance is ₹500.00</small>
                        </div>

                        <div class="mt-4 d-flex justify-content-end gap-2">
                            <a th:href="@{/accounts/savings}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Open Account</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
