<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Recurring Deposit - E-Bank26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('rd')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('New Recurring Deposit')}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">Recurring Deposit Parameters</h5>
                    <small class="text-muted">Monthly installments schedule will be auto-generated</small>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/accounts/rd/create}" th:object="${recurringDepositRequest}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Member *</label>
                            <select th:field="*{memberId}" class="form-select" required>
                                <option value="">-- Choose Member --</option>
                                <option th:each="m : ${members}" th:value="${m.memberId}" th:text="|${m.fullName} (${m.memberCode}) - ${m.mobile}|"></option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Monthly Installment Amount (INR) *</label>
                            <input type="number" step="10" min="100" th:field="*{monthlyAmount}" class="form-control" placeholder="Minimum ₹ 100" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('monthlyAmount')}" th:errors="*{monthlyAmount}"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Interest Rate (% p.a.) *</label>
                                <input type="number" step="0.01" th:field="*{interestRate}" class="form-control" placeholder="e.g. 7.00" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('interestRate')}" th:errors="*{interestRate}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Tenure (Months) *</label>
                                <input type="number" min="6" max="120" th:field="*{tenureMonths}" class="form-control" placeholder="Minimum 6 months" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tenureMonths')}" th:errors="*{tenureMonths}"></div>
                            </div>
                        </div>

                        <div class="mt-4 d-flex justify-content-end gap-2">
                            <a th:href="@{/accounts/rd}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Open Recurring Deposit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
