<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RD Installments - E-Bank26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('rd')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Recurring Deposit Schedule')}"></div>

    <!-- RD Summary Card -->
    <div class="card mb-4 border-primary">
        <div class="card-body p-4">
            <div class="row align-items-center">
                <div class="col-md-3">
                    <span class="text-muted small">RD Number</span>
                    <h4 class="fw-bold text-primary mb-0" th:text="${deposit.rdNumber}">RD30000001</h4>
                </div>
                <div class="col-md-3">
                    <span class="text-muted small">Member</span>
                    <h5 class="fw-semibold mb-0" th:text="${deposit.member.fullName}">John Doe</h5>
                    <small class="text-muted" th:text="|Code: ${deposit.member.memberCode}|"></small>
                </div>
                <div class="col-md-3">
                    <span class="text-muted small">Monthly Amount</span>
                    <h4 class="fw-bold text-dark mb-0" th:text="|₹ ${#numbers.formatDecimal(deposit.monthlyAmount, 1, 2)}|">₹ 1,000.00</h4>
                </div>
                <div class="col-md-3 text-end">
                    <span class="text-muted small">Maturity Payout</span>
                    <h4 class="fw-bold text-success mb-0" th:text="|₹ ${#numbers.formatDecimal(deposit.maturityAmount, 1, 2)}|">₹ 12,460.00</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- Installments Schedule Table -->
    <div class="card">
        <div class="card-header bg-white py-3">
            <h6 class="mb-0 fw-bold"><i class="bi bi-calendar3 me-2"></i> Installment Schedule</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4"># No</th>
                        <th>Due Date</th>
                        <th>Amount (INR)</th>
                        <th>Penalty</th>
                        <th>Paid Date</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inst : ${installments}">
                        <td class="ps-4 fw-bold" th:text="|# ${inst.installmentNo}|"># 1</td>
                        <td th:text="${#temporals.format(inst.dueDate, 'dd-MMM-yyyy')}">01-Feb-2026</td>
                        <td class="fw-semibold" th:text="|₹ ${#numbers.formatDecimal(inst.amount, 1, 2)}|">₹ 1,000.00</td>
                        <td th:text="${inst.penaltyAmount != null and inst.penaltyAmount > 0 ? '₹ ' + inst.penaltyAmount : '-'}">-</td>
                        <td th:text="${inst.paidDate != null ? #temporals.format(inst.paidDate, 'dd-MMM-yyyy') : '-'}">-</td>
                        <td>
                            <span class="badge" th:classappend="${inst.status == 'PAID' ? 'badge-active' : 'badge-pending'}" th:text="${inst.status}">PENDING</span>
                        </td>
                        <td class="text-end pe-4">
                            <form th:if="${inst.status == 'PENDING'}" th:action="@{/accounts/rd/pay-installment}" method="post" class="d-inline">
                                <input type="hidden" name="rdId" th:value="${deposit.rdId}">
                                <input type="hidden" name="installmentNo" th:value="${inst.installmentNo}">
                                <button type="submit" class="btn btn-sm btn-success">
                                    <i class="bi bi-cash-stack"></i> Pay Installment
                                </button>
                            </form>
                            <span th:if="${inst.status == 'PAID'}" class="text-success small fw-semibold"><i class="bi bi-check2-circle"></i> Paid</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
