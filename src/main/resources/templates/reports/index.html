<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports Center - E-Bank26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('reports')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Reporting Center')}"></div>

    <!-- Report Selector & Export Toolbar -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-center justify-content-between">
                <div class="col-md-7">
                    <div class="btn-group" role="group">
                        <a th:href="@{/reports(reportType='MEMBERS')}" class="btn"
                           th:classappend="${reportType == 'MEMBERS' ? 'btn-primary' : 'btn-outline-primary'}">
                            <i class="bi bi-people me-1"></i> Members
                        </a>
                        <a th:href="@{/reports(reportType='SAVINGS')}" class="btn"
                           th:classappend="${reportType == 'SAVINGS' ? 'btn-primary' : 'btn-outline-primary'}">
                            <i class="bi bi-wallet2 me-1"></i> Savings (SB)
                        </a>
                        <a th:href="@{/reports(reportType='FD')}" class="btn"
                           th:classappend="${reportType == 'FD' ? 'btn-primary' : 'btn-outline-primary'}">
                            <i class="bi bi-safe2 me-1"></i> Fixed Deposits
                        </a>
                        <a th:href="@{/reports(reportType='RD')}" class="btn"
                           th:classappend="${reportType == 'RD' ? 'btn-primary' : 'btn-outline-primary'}">
                            <i class="bi bi-calendar3 me-1"></i> Recurring Deposits
                        </a>
                        <a th:href="@{/reports(reportType='LOANS')}" class="btn"
                           th:classappend="${reportType == 'LOANS' ? 'btn-primary' : 'btn-outline-primary'}">
                            <i class="bi bi-cash-stack me-1"></i> Loans
                        </a>
                    </div>
                </div>

                <div class="col-md-5 text-end">
                    <a th:href="@{/reports/export(reportType=${reportType}, format='excel')}" class="btn btn-outline-success me-2">
                        <i class="bi bi-file-earmark-excel me-1"></i> Export Excel (.xlsx)
                    </a>
                    <a th:href="@{/reports/export(reportType=${reportType}, format='pdf')}" class="btn btn-outline-danger">
                        <i class="bi bi-file-earmark-pdf me-1"></i> Export PDF (.pdf)
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Report Table -->
    <div class="card">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h6 class="mb-0 fw-bold">
                <i class="bi bi-table me-2"></i>
                <span th:text="|Generated Report: ${reportType}|">Report Data</span>
            </h6>
            <span class="text-muted small">Total Records: <strong th:text="${#lists.size(rows)}">0</strong></span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">#</th>
                        <th th:each="header : ${headers}" th:text="${header}">Header</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row, rowStat : ${rows}">
                        <td class="ps-4 text-muted small" th:text="${rowStat.count}">1</td>
                        <td th:each="cell : ${row}" th:text="${cell}">Cell Value</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td th:colspan="${#lists.size(headers) + 1}" class="text-center py-4 text-muted">No data records found for this report.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
