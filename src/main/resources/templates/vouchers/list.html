<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Vouchers - E-Bank26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('vouchers')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('General Ledger & Vouchers')}"></div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Filter & Action Bar -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-2 justify-content-between align-items-center">
                <div class="col-md-8">
                    <form th:action="@{/vouchers}" method="get" class="row g-2">
                        <div class="col-md-6">
                            <input type="text" name="query" th:value="${query}" class="form-control" placeholder="Search voucher number or narration...">
                        </div>
                        <div class="col-md-3">
                            <select name="type" class="form-select">
                                <option value="" th:selected="${type == null or type == ''}">All Types</option>
                                <option value="RECEIPT" th:selected="${type == 'RECEIPT'}">Receipt Voucher</option>
                                <option value="PAYMENT" th:selected="${type == 'PAYMENT'}">Payment Voucher</option>
                                <option value="JOURNAL" th:selected="${type == 'JOURNAL'}">Journal Entry</option>
                                <option value="CONTRA" th:selected="${type == 'CONTRA'}">Contra / Transfer</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-outline-primary w-100">Filter</button>
                        </div>
                    </form>
                </div>
                <div class="col-md-3 text-end">
                    <a th:href="@{/vouchers/create}" class="btn btn-primary">
                        <i class="bi bi-plus-circle me-1"></i> Post Double-Entry Voucher
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Vouchers Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Voucher Number</th>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Narration</th>
                        <th>Amount (INR)</th>
                        <th>Ledger Split (Debit / Credit)</th>
                        <th class="pe-4 text-end">Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="v : ${vouchers}">
                        <td class="ps-4 fw-bold text-primary" th:text="${v.voucherNumber}">VCH-2026-0001</td>
                        <td th:text="${#temporals.format(v.voucherDate, 'dd-MMM-yyyy')}">01-Jan-2026</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${v.voucherType == 'RECEIPT' ? 'bg-success' : (v.voucherType == 'PAYMENT' ? 'bg-danger' : 'bg-primary')}"
                                  th:text="${v.voucherType}">RECEIPT</span>
                        </td>
                        <td th:text="${v.narration}">Transaction description</td>
                        <td class="fw-bold" th:text="|₹ ${#numbers.formatDecimal(v.amount, 1, 2)}|">₹ 1,000.00</td>
                        <td>
                            <div class="small" th:each="entry : ${v.entries}">
                                <span class="fw-semibold" th:text="${entry.ledgerAccount.ledgerName}"></span>:
                                <span th:if="${entry.debit > 0}" class="text-danger fw-bold" th:text="|Dr: ₹ ${entry.debit}|"></span>
                                <span th:if="${entry.credit > 0}" class="text-success fw-bold" th:text="|Cr: ₹ ${entry.credit}|"></span>
                            </div>
                        </td>
                        <td class="pe-4 text-end"><span class="badge badge-active" th:text="${v.status}">POSTED</span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(vouchers)}">
                        <td colspan="7" class="text-center py-4 text-muted">No vouchers posted yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${totalPages > 1}">
            <div class="small text-muted">Total: <span th:text="${totalItems}">0</span> vouchers</div>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/vouchers(page=${currentPage - 1}, query=${query}, type=${type})}">Prev</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i ? 'active' : ''}">
                    <a class="page-link" th:href="@{/vouchers(page=${i}, query=${query}, type=${type})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage >= totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/vouchers(page=${currentPage + 1}, query=${query}, type=${type})}">Next</a>
                </li>
            </ul>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
