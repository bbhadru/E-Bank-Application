<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Voucher - E-Bank26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('vouchers')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Post Accounting Voucher')}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">Double-Entry Journal Entry</h5>
                    <small class="text-muted">Enforces fundamental accounting principle: Total Debits must equal Total Credits</small>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/vouchers/create}" th:object="${voucherRequest}" method="post">
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Voucher Type *</label>
                                <select th:field="*{voucherType}" class="form-select" required>
                                    <option value="RECEIPT">Receipt Voucher</option>
                                    <option value="PAYMENT">Payment Voucher</option>
                                    <option value="JOURNAL">Journal Voucher</option>
                                    <option value="CONTRA">Contra / Bank Transfer</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Voucher Date *</label>
                                <input type="date" th:field="*{voucherDate}" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Total Amount (INR) *</label>
                                <input type="number" step="0.01" min="0.01" th:field="*{amount}" class="form-control" placeholder="Total amount" required>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Narration / Description *</label>
                                <input type="text" th:field="*{narration}" class="form-control" placeholder="Transaction explanation" required>
                            </div>
                        </div>

                        <h6 class="fw-bold mb-3 border-bottom pb-2">Ledger Entries (Debit / Credit Leg)</h6>

                        <!-- Debit Leg -->
                        <div class="p-3 bg-light rounded mb-3 border">
                            <span class="badge bg-danger mb-2">Debit Leg (Dr)</span>
                            <div class="row g-2">
                                <div class="col-md-7">
                                    <label class="form-label small fw-semibold">Debit Ledger Account *</label>
                                    <select th:field="*{entries[0].ledgerId}" class="form-select" required>
                                        <option value="">-- Choose Account --</option>
                                        <option th:each="acc : ${accounts}" th:value="${acc.ledgerId}" th:text="|${acc.ledgerName} (${acc.ledgerCode} - ${acc.ledgerType})|"></option>
                                    </select>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label small fw-semibold">Debit Amount (INR) *</label>
                                    <input type="number" step="0.01" min="0.01" th:field="*{entries[0].debit}" class="form-control" placeholder="Debit amount" required>
                                    <input type="hidden" th:field="*{entries[0].credit}" value="0.00">
                                </div>
                            </div>
                        </div>

                        <!-- Credit Leg -->
                        <div class="p-3 bg-light rounded mb-4 border">
                            <span class="badge bg-success mb-2">Credit Leg (Cr)</span>
                            <div class="row g-2">
                                <div class="col-md-7">
                                    <label class="form-label small fw-semibold">Credit Ledger Account *</label>
                                    <select th:field="*{entries[1].ledgerId}" class="form-select" required>
                                        <option value="">-- Choose Account --</option>
                                        <option th:each="acc : ${accounts}" th:value="${acc.ledgerId}" th:text="|${acc.ledgerName} (${acc.ledgerCode} - ${acc.ledgerType})|"></option>
                                    </select>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label small fw-semibold">Credit Amount (INR) *</label>
                                    <input type="number" step="0.01" min="0.01" th:field="*{entries[1].credit}" class="form-control" placeholder="Credit amount" required>
                                    <input type="hidden" th:field="*{entries[1].debit}" value="0.00">
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/vouchers}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Post Voucher</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
