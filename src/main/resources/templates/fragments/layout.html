<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Sidebar Fragment -->
<div th:fragment="sidebar(activeMenu)" class="sidebar">
    <a th:href="@{/dashboard}" class="brand">
        <i class="bi bi-bank2 text-primary"></i>
        <span>E-Bank26</span>
    </a>

    <div class="nav-header">Main</div>
    <a th:href="@{/dashboard}" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}" class="nav-link">
        <i class="bi bi-grid-1x2"></i>
        <span>Dashboard</span>
    </a>

    <div class="nav-header">Core Banking</div>
    <a th:href="@{/members}" th:classappend="${activeMenu == 'members' ? 'active' : ''}" class="nav-link">
        <i class="bi bi-people"></i>
        <span>Members</span>
    </a>
    <a th:href="@{/accounts/savings}" th:classappend="${activeMenu == 'savings' ? 'active' : ''}" class="nav-link">
        <i class="bi bi-wallet2"></i>
        <span>Savings (SB)</span>
    </a>
    <a th:href="@{/accounts/fd}" th:classappend="${activeMenu == 'fd' ? 'active' : ''}" class="nav-link">
        <i class="bi bi-safe2"></i>
        <span>Fixed Deposit (FD)</span>
    </a>
    <a th:href="@{/accounts/rd}" th:classappend="${activeMenu == 'rd' ? 'active' : ''}" class="nav-link">
        <i class="bi bi-calendar-check"></i>
        <span>Recurring Deposit (RD)</span>
    </a>
    <a th:href="@{/loans}" th:classappend="${activeMenu == 'loans' ? 'active' : ''}" class="nav-link">
        <i class="bi bi-cash-stack"></i>
        <span>Loans</span>
    </a>
    <a th:href="@{/shares}" th:classappend="${activeMenu == 'shares' ? 'active' : ''}" class="nav-link">
        <i class="bi bi-pie-chart"></i>
        <span>Share Capital</span>
    </a>

    <div class="nav-header">Finance & Books</div>
    <a th:href="@{/vouchers}" th:classappend="${activeMenu == 'vouchers' ? 'active' : ''}" class="nav-link">
        <i class="bi bi-journal-text"></i>
        <span>Vouchers & Ledger</span>
    </a>
    <a th:href="@{/reports}" th:classappend="${activeMenu == 'reports' ? 'active' : ''}" class="nav-link">
        <i class="bi bi-file-earmark-bar-graph"></i>
        <span>Reports</span>
    </a>
    <a th:href="@{/reports/trial-balance}" th:classappend="${activeMenu == 'trial-balance' ? 'active' : ''}" class="nav-link">
        <i class="bi bi-calculator"></i>
        <span>Trial Balance</span>
    </a>

    <div class="mt-4 px-3">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger w-100 btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </form>
    </div>
</div>

<!-- Topbar Fragment -->
<div th:fragment="topbar(pageTitle)" class="top-navbar">
    <div class="d-flex align-items-center gap-2">
        <h5 class="mb-0 fw-bold" th:text="${pageTitle}">Dashboard</h5>
    </div>
    <div class="d-flex align-items-center gap-3">
        <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">
            <i class="bi bi-circle-fill me-1 small"></i> System Active
        </span>
        <div class="dropdown">
            <button class="btn btn-sm btn-light border dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-person-circle me-1"></i> User
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li><a class="dropdown-item small" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="dropdown-item small text-danger"><i class="bi bi-box-arrow-right me-2"></i> Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>
