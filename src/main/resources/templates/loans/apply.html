<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Loan - E-Bank26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('loans')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Apply for Loan')}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">Loan Application & EMI Parameters</h5>
                    <small class="text-muted">Supports both Reducing Balance and Flat Rate EMI computation</small>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/loans/apply}" th:object="${loanRequest}" method="post">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Applicant Member *</label>
                                <select th:field="*{memberId}" class="form-select" required>
                                    <option value="">-- Choose Member --</option>
                                    <option th:each="m : ${members}" th:value="${m.memberId}" th:text="|${m.fullName} (${m.memberCode}) - ${m.mobile}|"></option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Loan Category / Type *</label>
                                <select th:field="*{loanType}" class="form-select" required>
                                    <option value="Personal Loan">Personal Loan</option>
                                    <option value="Business Loan">Business Loan</option>
                                    <option value="Agriculture Loan">Agriculture Loan</option>
                                    <option value="Gold Loan">Gold Loan</option>
                                    <option value="Vehicle Loan">Vehicle Loan</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Principal Loan Amount (INR) *</label>
                                <input type="number" step="1000" min="1000" th:field="*{principal}" class="form-control" placeholder="e.g. 50000" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('principal')}" th:errors="*{principal}"></div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Interest Rate (% p.a.) *</label>
                                <input type="number" step="0.01" th:field="*{interestRate}" class="form-control" placeholder="e.g. 12.00" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('interestRate')}" th:errors="*{interestRate}"></div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Tenure (Months) *</label>
                                <input type="number" min="1" max="360" th:field="*{tenureMonths}" class="form-control" placeholder="e.g. 12" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tenureMonths')}" th:errors="*{tenureMonths}"></div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">EMI Calculation Method</label>
                                <select th:field="*{emiType}" class="form-select">
                                    <option value="REDUCING">Reducing Balance (Standard)</option>
                                    <option value="FLAT">Flat Rate</option>
                                </select>
                            </div>

                            <div class="col-md-12 mt-4 d-flex justify-content-end gap-2">
                                <a th:href="@{/loans}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">Submit Application</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
