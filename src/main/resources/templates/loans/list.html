<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loans - E-Bank26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/static/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('loans')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Loan Management')}"></div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Filters & Action Bar -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-2 justify-content-between align-items-center">
                <div class="col-md-8">
                    <form th:action="@{/loans}" method="get" class="row g-2">
                        <div class="col-md-6">
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                                <input type="text" name="query" th:value="${query}" class="form-control" placeholder="Search loan no, member name...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select name="status" class="form-select">
                                <option value="" th:selected="${status == null or status == ''}">All Statuses</option>
                                <option value="PENDING" th:selected="${status == 'PENDING'}">Pending</option>
                                <option value="APPROVED" th:selected="${status == 'APPROVED'}">Approved</option>
                                <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Active</option>
                                <option value="CLOSED" th:selected="${status == 'CLOSED'}">Closed</option>
                                <option value="NPA" th:selected="${status == 'NPA'}">NPA</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-outline-primary w-100">Filter</button>
                        </div>
                    </form>
                </div>
                <div class="col-md-3 text-end">
                    <a th:href="@{/loans/apply}" class="btn btn-primary">
                        <i class="bi bi-plus-circle me-1"></i> Apply for Loan
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Loans Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Loan Number</th>
                        <th>Member Name</th>
                        <th>Loan Type</th>
                        <th>Principal (INR)</th>
                        <th>Outstanding Balance</th>
                        <th>EMI (INR)</th>
                        <th>Status</th>
                        <th>NPA</th>
                        <th class="text-end pe-4">Workflow Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="loan : ${loans}">
                        <td class="ps-4 fw-bold text-primary">
                            <a th:href="@{/loans/schedule/{id}(id=${loan.loanId})}" class="text-decoration-none" th:text="${loan.loanNumber}">LN40000001</a>
                        </td>
                        <td class="fw-medium" th:text="${loan.member.fullName}">John Doe</td>
                        <td th:text="${loan.loanType}">Personal Loan</td>
                        <td class="fw-semibold" th:text="|₹ ${#numbers.formatDecimal(loan.principal, 1, 2)}|">₹ 50,000.00</td>
                        <td class="fw-bold" th:text="|₹ ${#numbers.formatDecimal(loan.outstandingBalance, 1, 2)}|">₹ 50,000.00</td>
                        <td class="fw-semibold text-primary" th:text="|₹ ${#numbers.formatDecimal(loan.emiAmount, 1, 2)}|">₹ 4,442.00</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${loan.status == 'ACTIVE' or loan.status == 'DISBURSED' ? 'badge-active' : (loan.status == 'PENDING' ? 'badge-pending' : (loan.status == 'NPA' ? 'badge-npa' : 'badge-closed'))}"
                                  th:text="${loan.status}">PENDING</span>
                        </td>
                        <td>
                            <span th:if="${loan.npaFlag}" class="badge bg-danger">NPA</span>
                            <span th:unless="${loan.npaFlag}" class="text-muted small">Normal</span>
                        </td>
                        <td class="text-end pe-4">
                            <!-- Pending -> Approve -->
                            <form th:if="${loan.status == 'PENDING'}" th:action="@{/loans/approve/{id}(id=${loan.loanId})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-success">Approve</button>
                            </form>
                            <!-- Approved -> Disburse -->
                            <form th:if="${loan.status == 'APPROVED'}" th:action="@{/loans/disburse/{id}(id=${loan.loanId})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-success">Disburse</button>
                            </form>
                            <!-- Active -> View Schedule & Repay -->
                            <a th:if="${loan.status == 'ACTIVE' or loan.status == 'DISBURSED' or loan.status == 'CLOSED'}"
                               th:href="@{/loans/schedule/{id}(id=${loan.loanId})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-calendar3"></i> Schedule
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(loans)}">
                        <td colspan="9" class="text-center py-4 text-muted">No loans found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${totalPages > 1}">
            <div class="small text-muted">Total: <span th:text="${totalItems}">0</span> loans</div>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/loans(page=${currentPage - 1}, query=${query}, status=${status})}">Prev</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i ? 'active' : ''}">
                    <a class="page-link" th:href="@{/loans(page=${i}, query=${query}, status=${status})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage >= totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/loans(page=${currentPage + 1}, query=${query}, status=${status})}">Next</a>
                </li>
            </ul>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
